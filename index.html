<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Math Detective!</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            overflow: hidden;
            position: relative;
        }

        /* Floating background bubbles/shapes for subtle animation */
        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
            z-index: 1;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 2;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 40px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 550px;
            width: 95%;
            border: 8px solid #f9d423;
        }

        .level-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .level-btn {
            padding: 10px 15px;
            font-size: 1em;
            border-radius: 15px;
            cursor: pointer;
            border: 3px solid transparent;
            background: #eee;
            transition: transform 0.2s;
        }
        .level-btn:hover { transform: scale(1.05); }
        .level-btn.active {
            border-color: #e67e22;
            background: #f9d423;
            font-weight: bold;
        }
        h1 { color: #e67e22; margin: 0 0 15px 0; font-size: 2.2em; text-shadow: 1px 1px 0px white; }
        .stats { font-size: 1.3em; margin-bottom: 15px; background: #f9d423; padding: 8px 20px; border-radius: 20px; display: inline-block; font-weight: bold; color: #333; }

        .problem-area {
            background: #fdfbf7;
            padding: 20px;
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .problem-text {
            font-size: 3.2em;
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .blank-box {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 70px;
            height: 60px;
            border: 4px dashed #ff4757;
            border-radius: 15px;
            background: #fff5f5;
            color: #ff4757;
        }

        .tip-box {
            background: #e1f5fe;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #0277bd;
            border: 3px solid #b3e5fc;
            display: none;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button.choice {
            padding: 15px;
            font-size: 2em;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, filter 0.2s;
            font-weight: bold;
        }
        button.choice:hover { filter: brightness(1.1); transform: scale(1.03); }
        button.choice:active { transform: scale(0.95); }

        .btn-0 { background: #1e90ff; box-shadow: 0 6px 0 #0975da; }
        .btn-1 { background: #2ecc71; box-shadow: 0 6px 0 #27ae60; }
        .btn-2 { background: #ffa502; box-shadow: 0 6px 0 #e67e22; }
        .btn-3 { background: #a55eea; box-shadow: 0 6px 0 #8854d0; }

        .feedback { margin-top: 15px; height: 40px; font-size: 1.8em; font-weight: bold; }

        /* Celebration pop animation */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .celebrate { animation: pop 0.4s ease; }
    </style>
</head>
<body>
    <!-- Background animated bubbles -->
    <script>
        for (let i = 0; i < 15; i++) {
            let bubble = document.createElement('div');
            bubble.className = 'bubble';
            let size = Math.random() * 40 + 10 + 'px';
            bubble.style.width = size;
            bubble.style.height = size;
            bubble.style.left = Math.random() * 100 + 'vw';
            bubble.style.animationDuration = (Math.random() * 8 + 6) + 's';
            bubble.style.animationDelay = (Math.random() * 5) + 's';
            document.body.appendChild(bubble);
        }
    </script>

    <div class="container" id="container">
        <h1>🕵️ Math Detective! 🐾</h1>

        <div class="level-selector">
            <button class="level-btn active" onclick="setLevel('easy')">Beginner</button>
            <button class="level-btn" onclick="setLevel('medium')">Intermediate</button>
            <button class="level-btn" onclick="setLevel('hard')">Hard</button>
        </div>

        <div class="stats">🌟 Stars: <span id="score">0</span></div>

        <div id="tipBox" class="tip-box"></div>

        <div class="problem-area">
            <div id="problemText" class="problem-text"></div>
        </div>

        <div id="choices" class="choices">
            <button class="choice btn-0" onclick="checkAnswer(this)">?</button>
            <button class="choice btn-1" onclick="checkAnswer(this)">?</button>
            <button class="choice btn-2" onclick="checkAnswer(this)">?</button>
            <button class="choice btn-3" onclick="checkAnswer(this)">?</button>
        </div>
        <div id="feedback" class="feedback"></div>
    </div>

    <script>
        let score = 0;
        let correctAnswer = 0;
        let currentLevel = 'easy';

        function setLevel(lvl) {
            currentLevel = lvl;
            const btns = document.querySelectorAll('.level-btn');
            btns.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const tipBox = document.getElementById('tipBox');
            if (lvl === 'medium') {
                tipBox.style.display = 'block';
                tipBox.innerText = "💡 Tip: Count up from the known number until you reach the target answer!";
            } else if (lvl === 'hard') {
                tipBox.style.display = 'block';
                tipBox.innerText = "💡 Tip: Think of it like a puzzle. What piece is missing to make the equation balanced?";
            } else {
                tipBox.style.display = 'none';
            }

            nextProblem();
        }

        function nextProblem() {
            let n1, n2, target;
            let problemHTML = "";

            if (currentLevel === 'easy') {
                n1 = Math.floor(Math.random() * 6) + 1;
                n2 = Math.floor(Math.random() * 5) + 1;
                if (Math.random() > 0.5) {
                    correctAnswer = n1 + n2;
                    problemHTML = `${n1} + ${n2} = <div class="blank-box">?</div>`;
                } else {
                    n1 = Math.max(n1, n2) + 2;
                    correctAnswer = n1 - n2;
                    problemHTML = `${n1} - ${n2} = <div class="blank-box">?</div>`;
                }
            }
            else if (currentLevel === 'medium') {
                target = Math.floor(Math.random() * 10) + 5;
                const known = Math.floor(Math.random() * target);
                correctAnswer = target - known;

                if (Math.random() > 0.5) {
                    problemHTML = `<div class="blank-box">?</div> + ${known} = ${target}`;
                } else {
                    problemHTML = `${known} + <div class="blank-box">?</div> = ${target}`;
                }
            }
            else {
                const start = Math.floor(Math.random() * 10) + 10;
                const sub = Math.floor(Math.random() * 8) + 2;

                if (Math.random() > 0.5) {
                    problemHTML = `${start} - <div class="blank-box">?</div> = ${start - sub}`;
                    correctAnswer = sub;
                } else {
                    const v1 = Math.floor(Math.random() * 10) + 5;
                    const v2 = Math.floor(Math.random() * 10) + 5;
                    correctAnswer = v1 + v2;
                    problemHTML = `${v1} + ${v2} = <div class="blank-box` + `">?</div>`;
                }
            }

            document.getElementById('problemText').innerHTML = problemHTML;

            let choices = [correctAnswer];
            while (choices.length < 4) {
                let wrong = Math.max(0, correctAnswer + Math.floor(Math.random() * 7) - 3);
                if (!choices.includes(wrong)) choices.push(wrong);
            }
            choices.sort(() => Math.random() - 0.5);

            const buttons = document.querySelectorAll('button.choice');
            choices.forEach((val, i) => buttons[i].innerText = val);
            document.getElementById('feedback').innerText = "";
        }

        function checkAnswer(btn) {
            if (parseInt(btn.innerText) === correctAnswer) {
                score++;
                document.getElementById('score').innerText = score;
                document.getElementById('feedback').innerText = "Awesome! 🌟";
                document.getElementById('feedback').style.color = "#27ae60";

                const container = document.getElementById('container');
                container.classList.add('celebrate');
                setTimeout(() => container.classList.remove('celebrate'), 400);

                setTimeout(nextProblem, 1000);
            } else {
                document.getElementById('feedback').innerText = "Try again! 🐾";
                document.getElementById('feedback').style.color = "#e67e22";
            }
        }

        nextProblem();
    </script>
</body>
</html>
